server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }
    location = /index.html {
        expires -1;
    }
    # API calls use the explicitly configured external API origin.
    # Do not return the SPA for accidentally misdirected API requests.
    location /api/ {
        return 404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
