name: Check SSM connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      contents: read
      id-token: write

    env:
      INSTANCE_ID: i-03bd0c5ccfdd96e98
      AWS_PAGER: ""

    steps:
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::102798329445:role/sme-github-deploy-role
          aws-region: ap-south-1
          allowed-account-ids: '102798329445'

      - name: Send server check
        id: send
        shell: bash
        run: |
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "SME deployment connection check" \
            --timeout-seconds 60 \
            --parameters '{"commands":["set -e","whoami","hostname","docker --version"],"executionTimeout":["60"]}' \
            --query 'Command.CommandId' \
            --output text)

          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"

      - name: Wait for completion
        shell: bash
        env:
          COMMAND_ID: ${{ steps.send.outputs.command_id }}
        run: |
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

      - name: Show server response
        if: ${{ always() && steps.send.outputs.command_id != '' }}
        shell: bash
        env:
          COMMAND_ID: ${{ steps.send.outputs.command_id }}
        run: |
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,ExitCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json