name: Check AWS connection

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  connection:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::102798329445:role/sme-github-ecr-push-role
          aws-region: ap-south-1
          role-session-name: sme-github-connection-check
          allowed-account-ids: "102798329445"

      - name: Show AWS identity
        run: aws sts get-caller-identity

      - name: Check backend repository access
        run: aws ecr describe-images --repository-name sme-backend

      - name: Check frontend repository access
        run: aws ecr describe-images --repository-name sme-frontend
