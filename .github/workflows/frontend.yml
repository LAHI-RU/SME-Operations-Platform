name: Frontend checks
on:
  push:
    paths: ['frontend/**', 'backend/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend/**', 'backend/**', '.github/workflows/frontend.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_pgsql, pdo_sqlite, sqlite3
          coverage: none
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://api.example.invalid/api/v1
      - name: Prepare isolated backend dependencies
        working-directory: backend
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          cp .env.example .env
          php artisan key:generate --no-interaction
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: npm run test:browser
