services:
  backend:
    image: sme-backend:lesson-1
    restart: unless-stopped

    env_file:
      - ./backend/.env

    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://127.0.0.1:8001

      LOG_CHANNEL: stderr
      LOG_LEVEL: info

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_URL: ""

    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: nginx:stable-alpine
    restart: unless-stopped

    ports:
      - "127.0.0.1:8001:8080"

    volumes:
      - ./backend/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      backend:
        condition: service_started

    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/api/v1/health
      interval: 30s
      timeout: 5s
      retries: 3
